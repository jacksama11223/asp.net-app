name: SmartLMS Enterprise CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Backend
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/smartlms-backend
        tags: |
          type=raw,value=latest

    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        
    - name: Extract metadata for Community
      id: meta-community
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/smartlms-community
        tags: |
          type=raw,value=latest

    - name: Build and push Community image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: asp.net-group/SmartLMS.Community/Dockerfile
        push: true
        tags: ${{ steps.meta-community.outputs.tags }}

    - name: Extract metadata for Frontend
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/smartlms-frontend
        tags: |
          type=raw,value=latest

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./react-test-frontend
        file: react-test-frontend/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
