version: '3.8'

services:
  web:
    image: smartlms-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 1 # Giảm xuống 1 để nhẹ máy Micro 1GB RAM
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__DefaultConnection=Server=smartlms-db-prod;Database=SmartLMS;User Id=root;Password=YourStrongPassword123!;
      - ConnectionStrings__ReadOnlyConnection=Server=smartlms-db-prod;Database=SmartLMS;User Id=root;Password=YourStrongPassword123!;
      - Redis__ConnectionString=redis:6379,password=YourRedisPass
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "5181:8080"
    volumes:
      - ./keys:/root/.aspnet/DataProtection-Keys
    networks:
      - smartlms-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass YourRedisPass
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - smartlms-net

  rabbitmq:
    image: rabbitmq:3-management
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - smartlms-net

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://web:8080
    deploy:
      replicas: 1
    networks:
      - smartlms-net

networks:
  smartlms-net:
    driver: bridge # Chuyển sang bridge để chạy ổn định trên 1 node
