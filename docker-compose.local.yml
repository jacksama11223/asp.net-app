services:
  db:
    image: mariadb:latest
    container_name: smartlms-db-local
    environment:
      - MYSQL_ROOT_PASSWORD=AnhLongPro123!
      - MYSQL_DATABASE=SmartLMS
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lms-local

  web-app:
    image: smartlms-web:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5181:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=SmartLMS;User=root;Password=AnhLongPro123!;
      - ConnectionStrings__ReadOnlyConnection=Server=db;Port=3306;Database=SmartLMS;User=root;Password=AnhLongPro123!;
    depends_on:
      - db
    networks:
      - lms-local

networks:
  lms-local:
    driver: bridge
