# Optimized for Oracle Cloud Free Tier (503MB RAM)

services:
  db:
    image: mariadb:latest
    container_name: smartlms-db-prod
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=YourStrongPassword123!
      - MYSQL_DATABASE=SmartLMS
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    mem_limit: 300m
    command: >
      --innodb-buffer-pool-size=64M
      --innodb-log-file-size=128M
      --max-connections=5000
      --tmp-table-size=64M
      --query-cache-size=0
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartlms-net

  backend:
    image: ghcr.io/jacksama11223/asp.net-app/smartlms-backend:latest
    restart: always
    mem_limit: 250m
    deploy:
      replicas: 1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=SmartLMS;User=root;Password=YourStrongPassword123!;SslMode=None;Maximum Pool Size=100;Connection Timeout=300;Command Timeout=300;
      - ConnectionStrings__ReadOnlyConnection=Server=db;Port=3306;Database=SmartLMS;User=root;Password=YourStrongPassword123!;SslMode=None;Maximum Pool Size=100;Connection Timeout=300;Command Timeout=300;
      - Redis__ConnectionString=redis:6379,password=YOUR_REDIS_PASSWORD_HERE
      - RabbitMQ__HostName=rabbitmq
      - COMPlus_gcServer=0
      - DOTNET_GCConserveMemory=9
      - DOTNET_GCHeapHardLimitPercent=75
      - Logging__LogLevel__Default=Critical
      - Logging__LogLevel__Microsoft=Critical
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5181:8080"
    networks:
      - smartlms-net

  community:
    image: ghcr.io/jacksama11223/asp.net-app/smartlms-community:latest
    restart: always
    mem_limit: 150m
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=SmartLMS;User=root;Password=YourStrongPassword123!;SslMode=None;Maximum Pool Size=100;Connection Timeout=300;Command Timeout=300;
      - Redis__ConnectionString=redis:6379,password=YOUR_REDIS_PASSWORD_HERE
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5183:8080"
      - "3080:8080"
    networks:
      - smartlms-net

  frontend:
    image: ghcr.io/jacksama11223/asp.net-app/smartlms-frontend:latest
    container_name: smartlms-frontend-prod
    restart: always
    mem_limit: 30m
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - smartlms-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass YOUR_REDIS_PASSWORD_HERE --maxmemory 32mb --maxmemory-policy allkeys-lru
    mem_limit: 40m
    ports:
      - "6379:6379"
    networks:
      - smartlms-net

  tunnel:
    container_name: smartlms-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token $CF_TUNNEL_TOKEN
    mem_limit: 30m
    networks:
      - smartlms-net

  # ✅ Tầng Load Balancer điều phối traffic giữa 2 VPS
  lb:
    image: nginx:stable-alpine
    container_name: smartlms-lb
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - smartlms-net

volumes:
  mariadb-data:

networks:
  smartlms-net:
    driver: bridge
