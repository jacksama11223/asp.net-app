services:
  db:
    image: mariadb:latest
    container_name: smartlms-db-prod
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=YourStrongPassword123!
      - MYSQL_DATABASE=SmartLMS
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    # ✅ Giới hạn RAM cho MariaDB: tiết kiệm ~150MB
    mem_limit: 150m
    command: >
      --innodb-buffer-pool-size=64M
      --innodb-log-file-size=32M
      --max-connections=30
      --tmp-table-size=16M
      --query-cache-size=0
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartlms-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartlms-backend-prod
    restart: always
    # ✅ Giới hạn RAM cho .NET Backend: giảm GC pressure
    mem_limit: 200m
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=SmartLMS;User=root;Password=YourStrongPassword123!;
      - ConnectionStrings__ReadOnlyConnection=Server=db;Port=3306;Database=SmartLMS;User=root;Password=YourStrongPassword123!;
      - Redis__ConnectionString=redis:6379,password=YourRedisPass
      - RabbitMQ__HostName=rabbitmq
      # ✅ Tối ưu .NET GC cho server ít RAM
      - DOTNET_GCConserveMemory=9
      - DOTNET_GCHeapHardLimit=150000000
      - COMPlus_GCConserveMemory=9
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5181:8080"
    networks:
      - smartlms-net

  frontend:
    build:
      context: ./react-test-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5181
    container_name: smartlms-frontend-prod
    restart: always
    mem_limit: 30m
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartlms-net

  # ✅ Dùng Redis nhẹ nhàng hơn với giới hạn bộ nhớ
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass YourRedisPass --maxmemory 32mb --maxmemory-policy allkeys-lru
    mem_limit: 40m
    networks:
      - smartlms-net

  # ✅ RabbitMQ bị loại bỏ để tiết kiệm ~200MB RAM
  # Backend đang dùng MockBus (Development mode) nên không cần RabbitMQ

  tunnel:
    container_name: smartlms-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token $CF_TUNNEL_TOKEN
    mem_limit: 30m
    networks:
      - smartlms-net

volumes:
  mariadb-data:

networks:
  smartlms-net:
    driver: bridge
