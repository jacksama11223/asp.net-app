version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: smartlms-db-prod
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=YourStrongPassword123!
      - MYSQL_DATABASE=SmartLMS
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartlms-net

  backend:
    image: ghcr.io/jacksama11223/asp.net-app/smartlms-backend:latest
    container_name: smartlms-backend-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=SmartLMS;User=root;Password=YourStrongPassword123!;
      - ConnectionStrings__ReadOnlyConnection=Server=db;Port=3306;Database=SmartLMS;User=root;Password=YourStrongPassword123!;
      - Redis__ConnectionString=redis:6379,password=YourRedisPass
      - RabbitMQ__HostName=rabbitmq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "5181:8080" # Mapping to 5181 for external consistency
    networks:
      - smartlms-net

  frontend:
    build:
      context: ./react-test-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5181 # This should be your server's Public IP/Domain in prod
    container_name: smartlms-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartlms-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass YourRedisPass
    networks:
      - smartlms-net

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - smartlms-net

  tunnel:
    container_name: smartlms-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token $CF_TUNNEL_TOKEN
    networks:
      - smartlms-net

volumes:
  mariadb-data:

networks:
  smartlms-net:
    driver: bridge
