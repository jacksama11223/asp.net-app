events { worker_connections 10000; }

http {
    upstream smartlms_backend {
        # Thuật toán Least Connections (Ưu tiên server đang rảnh)
        least_conn; 
        
        # VPS-A (Local) - Trọng số 1
        server backend:8080 weight=1; 
        
        # VPS-B (Remote) - Trọng số 2 (Ưu tiên gánh tải nhiều hơn gấp đôi vì có 9GB Swap)
        server 145.241.160.156:5181 weight=2; 
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://smartlms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Giao diện Frontend (Phục vụ trực tiếp từ VPS-A)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}
