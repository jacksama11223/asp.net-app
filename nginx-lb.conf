events { worker_connections 10000; }

http {
    upstream smartlms_backend {
        # VPS-A (Local) - Trọng số 2
        server backend:8080 weight=2; 
        
        # VPS-B (Remote) - 3 bản sao (Tạm đóng để tránh code cũ trong lúc test)
        # server 145.241.160.156:5381 weight=2 max_fails=1 fail_timeout=30s; 
        # server 145.241.160.156:5382 weight=2 max_fails=1 fail_timeout=30s; 
        # server 145.241.160.156:5383 weight=2 max_fails=1 fail_timeout=30s; 

        keepalive 100;
    }

    upstream smartlms_community {
        # Cân bằng tải cho Group Learning Hub giữa 2 VPS
        server community:8080 weight=3; # Gọi trực tiếp service local qua Docker Network
        # server 145.241.160.156:5384 weight=2 max_fails=1 fail_timeout=30s; # Chia tải sang VPS-B
        keepalive 50;
    }

    # ✅ Cấu hình vùng nhớ đệm 100MB cho Nginx
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # ✅ Định nghĩa vùng giới hạn: 200 yêu cầu/giây cho mỗi IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;

    # ✅ Kích hoạt Nén Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;

    server {
        listen 80;

        # ✅ Nới lỏng Timeout để tránh lỗi 504 nhưng rút ngắn Connect Timeout để Failover nhanh
        proxy_connect_timeout 2s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # ✅ Lối vào cho Quản trị viên, Tài khoản & Identity (ASP.NET MVC/Razor)
        # Sử dụng case-sensitive (~) để phân biệt /dashboard (Frontend) và /Dashboard (Backend)
        location ~ ^/(Admin|Account|Identity|hangfire|lib|css|js|images|UserManagement|Dashboard|CodingChallenge|Assessment|Payment|Revenue|CourseManagement|dashboardHub|gamificationHub|notificationHub)(/|$) {
            proxy_pass http://smartlms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Hỗ trợ WebSockets cho SignalR hubs
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            add_header X-Server-Node $upstream_addr;
        }

        # ✅ Lối vào cho Swagger API UI (Tài liệu API toàn hệ thống)
        location ~* ^/(swagger)(/|$) {
            proxy_pass http://smartlms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Server-Node $upstream_addr;
        }

        # ✅ Lối vào cho API
        location /api/ {
            proxy_pass http://smartlms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Server-Node $upstream_addr;
            
            # Tối ưu cho API gánh tải cao
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ✅ Lối vào cho API công khai (có giới hạn và CACHE)
        location /api/public/ {
            # 🛡️ Áp dụng Micro-caching 30 giây
            proxy_cache api_cache;
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status; # Để kiểm tra cache có hoạt động không

            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://smartlms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Server-Node $upstream_addr;
        }

        # ✅ Lối vào cho React Frontend (Mặc định)
        location / {
            # Hỗ trợ WebSockets cho Frontend (Vite/React)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Server-Node $upstream_addr;
        }

        # ✅ Lối vào cho Group Learning Hub (Community - Cổng 8080)
        location ^~ /hub/ {
            proxy_pass http://smartlms_community/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Server-Node $upstream_addr;
            
            # Tối ưu cho kết nối Hub
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Redirect /hub sang /hub/ để đảm bảo đồng bộ
        location = /hub {
            return 301 $scheme://$host/hub/;
        }
    }
}
