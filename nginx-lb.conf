events { worker_connections 10000; }

http {
    upstream smartlms_backend {
        least_conn; 
        
        # VPS-A (Local) - Trọng số 2
        server backend:8080 weight=2; 
        
        # VPS-B (Remote) - 3 bản sao, mỗi bản gánh trọng số 2
        server 145.241.160.156:5381 weight=2; 
        server 145.241.160.156:5382 weight=2; 
        server 145.241.160.156:5383 weight=2; 

        # ✅ Giữ 100 kết nối mở sẵn để tái sử dụng
        keepalive 100;
    }

    # ✅ Định nghĩa vùng giới hạn: 200 yêu cầu/giây cho mỗi IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;

    # ✅ Kích hoạt Nén Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;

    server {
        listen 80;

        # ✅ Nới lỏng Timeout để tránh lỗi 504 khi gánh tải nặng
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # ✅ Lối vào cho Quản trị viên & Identity (ASP.NET MVC/Razor)
        location ~* ^/(Admin|Identity|hangfire|lib|css|js|images)/ {
            proxy_pass http://smartlms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ✅ Lối vào cho API
        location /api/ {
            proxy_pass http://smartlms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Tối ưu cho API gánh tải cao
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ✅ Lối vào cho API công khai (có giới hạn)
        location /api/public/ {
            # 🛡️ Áp dụng giới hạn cho API Stress Test
            # burst=50: Cho phép vọt lên thêm 50 req
            # nodelay: Xử lý ngay lập tức nếu còn trong hàng đợi
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://smartlms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ✅ Lối vào cho React Frontend (Mặc định)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
