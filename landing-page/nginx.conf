events {}

http {
    upstream backend_cluster {
        server YOUR_VPS_IP:5181; # IP của VPS B (ASP.NET Core)
    }

    upstream frontend_cluster {
        server YOUR_VPS_IP:5173; # IP của VPS B (React)
    }

    server {
        listen 80;

        # 1. Trang chủ Marketing (PHP trên VPS A)
        location / {
            proxy_pass http://lms-landing-page:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Student Portal (React trên VPS B)
        location /app/ {
            proxy_pass http://frontend_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. API Core (ASP.NET trên VPS B)
        location /api/ {
            proxy_pass http://backend_cluster/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. SignalR Hubs (Cần cấu hình WebSocket)
        location ~ /(dashboardHub|gamificationHub) {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}

